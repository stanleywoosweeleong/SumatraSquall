<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b4f5c">
<title>苏门答腊飑线 Sumatra Squall</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#e7eef2; --panel:#ffffff; --ink:#0f1f2a; --ink2:#1f3646; --line:#aebfcb;
  --sea:#0b6674; --sea-d:#07434d; --sea-l:#d6eaee;
  --low:#2e7d4f; --watch:#9a5b00; --likely:#c2410c; --strong:#b42318;
  --fs:17px;
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{overflow-x:clip;font-size:var(--fs);scroll-padding-top:calc(64px + env(safe-area-inset-top,0px))}
body{overflow-x:clip;margin:0;background:var(--bg);color:var(--ink);
  font:500 1rem/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",Roboto,sans-serif;
  padding-bottom:calc(78px + env(safe-area-inset-bottom,0px));-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
a{color:var(--sea-d);font-weight:600}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:1000;background:var(--sea-d);color:#fff;
  display:flex;align-items:center;gap:8px;padding:10px 12px}
header.top h1{flex:1;min-width:0;margin:0;font-size:1.18rem;font-weight:700;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{flex:none;min-width:48px;height:42px;border:2px solid #ffffffb0;background:transparent;color:#fff;border-radius:4px;font-weight:700;padding:0 10px}
.hbtn:focus-visible,.seg button:focus-visible,.navb:focus-visible{outline:3px solid #f5b83d;outline-offset:2px}

main{max-width:880px;margin:0 auto;padding:12px}
section.blk{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;margin:0 0 14px}
h2{font-size:1.2rem;margin:0 0 8px;line-height:1.3}
h3{font-size:1.05rem;margin:14px 0 6px}
p{margin:.4em 0}
.sub{color:var(--ink2)}

/* banners */
.banner{border-radius:5px;padding:10px 12px;margin:0 0 12px;border:2px solid;font-weight:600}
.banner.red{background:#fdecea;border-color:var(--strong);color:#6e130d}
.banner.amber{background:#fff4e0;border-color:var(--watch);color:#5a3500}
.fresh{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:12px}
.fresh .ftxt{flex:1;min-width:220px}
.rbtn{min-height:44px;border:2px solid var(--sea);background:#fff;color:var(--sea-d);border-radius:4px;padding:0 14px;font-weight:700}
.rbtn[disabled]{border-color:var(--line);color:#4a5d6a;cursor:default}

/* settings */
.settings{display:grid;gap:10px}
.setrow .lab{font-weight:700;margin-bottom:4px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:46px;border:2px solid var(--sea);background:#fff;color:var(--sea-d);border-radius:4px;padding:4px 12px;font-weight:700;text-align:left;line-height:1.25}
.seg button small{display:block;font-size:.88rem;font-weight:600;color:inherit}
.seg button[aria-pressed="true"]{background:var(--sea);color:#fff}

/* verdict */
#verdict{border-left:12px solid var(--line)}
#verdict.low{border-left-color:var(--low)} #verdict.watch{border-left-color:var(--watch)}
#verdict.likely{border-left-color:var(--likely)} #verdict.strong{border-left-color:var(--strong)}
.vtop{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.vlevel{font-size:1.75rem;font-weight:800;line-height:1.15}
.vscore{font-size:1.2rem;font-weight:700;font-variant-numeric:tabular-nums}
.low .vlevel{color:var(--low)} .watch .vlevel{color:var(--watch)} .likely .vlevel{color:var(--likely)} .strong .vlevel{color:var(--strong)}
.vnight{font-weight:700;color:var(--ink2);margin-bottom:2px}
.vreason{font-size:1.06rem;margin:8px 0}
.vearly{font-weight:700;background:var(--sea-l);border-radius:4px;padding:8px 10px;margin:8px 0}
.disc{font-size:.94rem;color:var(--ink2);border-top:1px solid var(--line);padding-top:8px;margin-top:10px}
ul.adv{margin:6px 0 0;padding:0;list-style:none}
ul.adv li{position:relative;padding:6px 0 6px 30px;border-bottom:1px solid #dfe7ec}
ul.adv li:last-child{border-bottom:0}
ul.adv li::before{content:"";position:absolute;left:8px;top:.62em;width:9px;height:9px;background:var(--sea);border-radius:50%}
#live{border-left:12px solid #8aa0ae}
#live.approach{border-left-color:var(--strong)} #live.clearPart{border-left-color:var(--watch)} #live.line{border-left-color:var(--likely)} #live.scattered{border-left-color:var(--watch)} #live.clear{border-left-color:var(--low)}
.lvstate{font-size:1.45rem;font-weight:800;line-height:1.2}
#live.approach .lvstate{color:var(--strong)} #live.line .lvstate{color:var(--likely)} #live.scattered .lvstate{color:var(--watch)} #live.clear .lvstate{color:var(--low)} #live.clearPart .lvstate{color:var(--watch)}
.lvact{font-weight:800;background:#fdecea;border-radius:4px;padding:8px 10px;margin:8px 0}
.lveta{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;margin:4px 0}
.lveta td{padding:5px 4px;border-top:1px solid #d6e0e6}
.lveta td:last-child{text-align:right;font-weight:700}
.lvsmall{font-size:.94rem;color:var(--ink2);margin-top:6px}

/* strip — the Strait, hour by hour */
.strip{display:grid;grid-template-columns:repeat(19,minmax(0,1fr));gap:2px;margin:10px 0 4px}
.scell{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;min-width:0}
.scell .bar{width:100%;height:46px;border-radius:2px;background:#e3eaee;border:1px solid #c2d0d9}
.scell.now .bar{box-shadow:inset 0 0 0 3px var(--ink),inset 0 0 0 5px #fff}
.scell.now.gust .bar{box-shadow:inset 0 0 0 3px var(--ink),inset 0 0 0 5px #fff,inset 0 -9px 0 var(--strong)}
.scell.gust .bar{box-shadow:inset 0 -7px 0 var(--strong)}
.scell svg{width:100%;max-width:22px;height:22px;margin-top:3px}
.scell .hh{font-size:.82rem;font-weight:800;height:1.25em;margin-bottom:3px;white-space:nowrap;overflow:visible;font-variant-numeric:tabular-nums}
.stripkey{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.92rem;align-items:center;margin-top:6px}
.akey{width:26px;height:26px;vertical-align:middle;margin:0 2px 0 6px}
.akeyrow{flex-basis:100%;line-height:2}
.sw{display:inline-block;width:18px;height:14px;border:1px solid #9fb2bf;vertical-align:-2px;margin-right:4px;border-radius:2px}

/* ingredients */
details.fold{border:1px solid var(--line);border-radius:5px;padding:0 12px;margin:10px 0 0;background:#f7fafb}
details.fold>summary{min-height:46px;display:flex;align-items:center;font-weight:700;cursor:pointer;list-style:none}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::before{content:"";width:0;height:0;border:7px solid transparent;border-left:10px solid var(--sea);margin-right:10px;transition:transform .15s}
details.fold[open]>summary::before{transform:rotate(90deg) translate(3px,3px)}
.ing{display:grid;gap:8px;padding-bottom:12px}
.irow{border-top:1px solid #d6e0e6;padding-top:8px}
.irow .ih{display:flex;justify-content:space-between;gap:10px;font-weight:700}
.irow .ipts{font-variant-numeric:tabular-nums;white-space:nowrap}
.ibar{height:10px;background:#dde6eb;border-radius:2px;margin:5px 0;overflow:hidden}
.ibar i{display:block;height:100%;background:var(--sea)}
.irow .iraw{font-variant-numeric:tabular-nums}
.irow .ithr{font-size:.92rem;color:var(--ink2)}
.itot{font-weight:800;border-top:2px solid var(--ink);padding-top:8px;display:flex;justify-content:space-between}

/* map */
#mapwrap{position:relative}
#mapbox{height:min(76vh,640px);min-height:420px;border:1px solid var(--line);border-radius:5px;background:#1b2a33}
/* scroll rails: invisible strips down both edges of the map on touch screens. A finger dragged on them
   scrolls the PAGE instead of panning the map. The left one starts below the zoom buttons.
   Above the map panes (≤700) but below Leaflet's control corners (1000), the time badge and the exit button (900). */
.rail{display:none}
@media (hover:none) and (pointer:coarse){
  .rail{display:block;position:absolute;z-index:850;width:44px;bottom:0;touch-action:pan-y;background:transparent;-webkit-tap-highlight-color:transparent}
  .rail-l{left:0;top:96px}
  .rail-r{right:0;top:0}
  #mapwrap.fs .rail{display:none}
}
#mapTimes{position:absolute;top:10px;right:10px;z-index:900;background:#0f1f2ae6;color:#fff;border-radius:5px;padding:6px 10px;font-weight:700;font-size:.95rem;line-height:1.4;max-width:62%;pointer-events:none;font-variant-numeric:tabular-nums}
#mapTimes:empty{display:none}
#fsExit{position:absolute;right:10px;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:900;min-height:48px;padding:0 16px;border:2px solid #fff;background:#0f1f2a;color:#fff;border-radius:5px;font-weight:800}
#mapwrap.fs{position:fixed;inset:0;z-index:3000;background:#1b2a33;padding:env(safe-area-inset-top,0px) 0 0}
#mapwrap.fs #mapbox{height:100%;min-height:0;border:0;border-radius:0}
#mapwrap.fs{overscroll-behavior:none;touch-action:none}
#mapwrap.fs #mapTimes{top:calc(env(safe-area-inset-top,0px) + 72px)}
#mapwrap.fs .leaflet-bottom{padding-bottom:env(safe-area-inset-bottom,0px)}
.leaflet-control-attribution{line-height:1.35}
.sat-pane-img img{filter:contrast(1.35) brightness(1.05)}
.maperr{padding:40px 16px;text-align:center;font-weight:700}
.ctl{display:grid;gap:10px;margin:10px 0}
.slwrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.slwrap input[type=range]{flex:1 1 180px;min-width:0;height:36px;accent-color:var(--sea)}
.sltime{min-width:9.5em;font-weight:800;font-variant-numeric:tabular-nums}
.grp{border:1px solid var(--line);border-radius:5px;padding:8px 10px 10px;display:grid;gap:8px;background:#f7fafb}
.grplab{font-weight:800}
.wread{font-weight:700;background:var(--sea-l);border-left:6px solid var(--sea);border-radius:4px;padding:8px 10px;line-height:1.5}
.wread p{margin:0}
.wread p+p{margin-top:4px}
.seg .seglab{align-self:center;font-weight:700;margin-right:4px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.93rem;margin-top:6px}
.legend .lg{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.lsrc{font-size:.93rem;color:var(--ink2)}
.eta{margin-top:10px;border:2px solid var(--strong);border-radius:5px;padding:10px 12px;background:#fff7f5}
.eta table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.eta td{padding:5px 4px;border-top:1px solid #efd4cf;vertical-align:top}
.eta td:last-child{text-align:right;font-weight:700}
.markhint{font-weight:800;color:var(--strong)}
.leaflet-container{font:inherit}
.leaflet-popup-content{font-size:1rem;line-height:1.45;margin:10px 12px}
.leaflet-control-attribution{font-size:11px}
.leaflet-tooltip.tlab{background:#0f1f2ad9;color:#fff;border:0;box-shadow:none;font-weight:700;font-size:.85rem;padding:1px 6px}
.leaflet-tooltip.tlab::before{display:none}

/* towns */
.mstrip{display:grid;grid-template-columns:repeat(21,minmax(0,1fr));gap:2px;margin:8px 0 2px}
.mcell{display:flex;flex-direction:column;align-items:center;min-width:0}
.mcell .hh{font-size:.82rem;font-weight:800;height:1.25em;white-space:nowrap;margin-bottom:3px}
.mcell .bar{width:100%;height:40px;border-radius:2px;border:1px solid #c2d0d9}
.mcell.gust .bar{box-shadow:inset 0 -7px 0 var(--strong)}
.mcell .mm{font-size:.72rem;font-weight:700;height:1.2em;font-variant-numeric:tabular-nums}
.mfacts{display:grid;gap:4px;margin-top:8px}
.mfacts p{margin:0}
.tgroup h3{border-bottom:2px solid var(--ink);padding-bottom:3px}
.town{border-bottom:1px solid #d6e0e6;padding:8px 0}
.town .tn{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.town .tn b{font-size:1.06rem}
.tag{display:inline-block;padding:1px 8px;border-radius:3px;font-weight:700;font-size:.9rem;border:2px solid}
.tag.sig{background:var(--strong);border-color:var(--strong);color:#fff}
.tag.q{background:#fff;border-color:#8aa0ae;color:var(--ink2)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr));gap:2px 12px;margin-top:3px;font-variant-numeric:tabular-nums}
.tgrid span{color:var(--ink2)}
.tgrid b{font-weight:700;color:var(--ink)}
.gcount{font-weight:700;margin:4px 0 2px}
.enote{background:var(--sea-l);border-radius:4px;padding:8px 10px;margin:6px 0}

/* guide */
.diag{width:100%;height:auto;display:block;margin:8px 0;border:1px solid var(--line);border-radius:4px;background:#f3f8fa}
.cal{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:3px;margin:8px 0}
.cal div{overflow-wrap:anywhere;line-height:1.2;text-align:center;padding:10px 0 4px;border-radius:2px;font-size:.85rem;font-weight:700}
ol.steps{padding-left:1.4em;margin:6px 0} ol.steps li{margin:4px 0}
table.thr{width:100%;border-collapse:collapse;font-size:.95rem}
table.thr td,table.thr th{border-top:1px solid #d6e0e6;padding:6px 4px;text-align:left;vertical-align:top}
/* share */
.sharebox{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.qrwrap svg{width:200px;height:200px;display:block;border:1px solid var(--line);border-radius:4px;background:#fff}
.sharetxt{flex:1;min-width:220px}
.shareurl{font-weight:800;word-break:break-all}
.btnlink{display:inline-flex;align-items:center;min-height:46px;padding:4px 14px;border-radius:4px;font-weight:800;text-decoration:none;border:2px solid}
.btnlink.wa{background:#1f7a3d;border-color:#1f7a3d;color:#fff}
#btnCopy{min-height:46px;border:2px solid var(--sea);background:#fff;color:var(--sea-d);border-radius:4px;padding:4px 14px;font-weight:800}
footer.foot{font-size:.92rem;color:var(--ink2);padding:6px 2px 20px}

/* bottom nav */
nav.bot{position:fixed;left:0;right:0;bottom:0;z-index:1000;background:#fff;border-top:2px solid var(--sea-d);
  display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
.navb{border:0;background:none;padding:6px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:1px;font-weight:700;font-size:.92rem;color:var(--sea-d)}
.navb svg{width:26px;height:26px}
.navb.on{background:var(--sea-l)}

/* overlays */
.ovl{position:fixed;inset:0;z-index:2000;background:#0a2a33e6;display:flex;align-items:center;justify-content:center;padding:20px}
.ovl .card{background:#fff;border-radius:8px;padding:22px;max-width:420px;width:100%}
.ovl .card h2{font-size:1.3rem}
.ovl .lbtn{display:block;width:100%;min-height:58px;margin:10px 0;border:2px solid var(--sea);background:#fff;color:var(--sea-d);border-radius:5px;font-size:1.2rem;font-weight:800}
.ovl .lbtn[aria-pressed="true"]{background:var(--sea);color:#fff}
.coord{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.coord label{display:grid;gap:4px;font-weight:700}
.coord input{font:inherit;font-size:1.1rem;font-weight:600;min-height:48px;padding:6px 10px;border:2px solid var(--sea);border-radius:4px;width:100%;color:var(--ink);background:#fff}
.homemsg{font-weight:800;color:var(--strong);min-height:1em}
#btnGps,#btnCoord{min-height:48px;border:2px solid var(--sea);background:var(--sea);color:#fff;border-radius:4px;padding:4px 14px;font-weight:800}
.homecard{max-height:86vh;overflow-y:auto}
.homecard h3{margin:14px 0 4px}
.homecard .seg button{min-width:6.5em}
.toast{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:1500;background:var(--ink);color:#fff;border:0;border-radius:6px;padding:14px;font-weight:700;text-align:left}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <h1 id="appTitle">苏门答腊飑线</h1>
  <button class="hbtn" id="btnSize" aria-label="Aa">Aa</button>
  <button class="hbtn" id="btnLang">中文</button>
</header>

<main>
  <div id="banner"></div>
  <div class="fresh"><div class="ftxt" id="fresh"></div><button class="rbtn" id="btnReload"></button></div>

  <section class="blk" id="settings">
    <h2 id="setTitle"></h2>
    <div class="settings">
      <div class="setrow"><div class="lab" id="setNight"></div><div class="seg" id="segNight"></div></div>
      <div class="setrow"><div class="lab" id="setModel"></div><div class="seg" id="segModel"></div></div>
      <div class="setrow"><div class="lab" id="setHome"></div><div class="seg" id="segHome"></div></div>
    </div>
  </section>

  <section class="blk live" id="live"><h2 id="liveHead"></h2><div id="liveBody"></div></section>

  <section class="blk" id="verdict">
    <div class="vnight" id="vNight"></div>
    <div class="vtop"><div class="vlevel" id="vLevel">…</div><div class="vscore" id="vScore"></div></div>
    <p class="vreason" id="vReason"></p>
    <div class="vearly" id="vEarly" hidden></div>
    <h3 id="advHead"></h3>
    <ul class="adv" id="adv"></ul>
    <h3 id="stripHead"></h3>
    <p class="sub" id="stripSub"></p>
    <div class="strip" id="strip"></div>
    <div class="stripkey" id="stripKey"></div>
    <details class="fold" id="ingFold"><summary id="ingHead"></summary><div class="ing" id="ing"></div></details>
    <p class="disc" id="disc"></p>
  </section>

  <section class="blk" id="mine"><h2 id="mineHead"></h2><div id="mineBody"></div></section>

  <section class="blk" id="map">
    <h2 id="mapHead"></h2>
    <p class="sub" id="mapSub"></p>
    <div class="ctl">
      <div class="seg" id="segView"></div>
      <div class="grp"><div class="grplab" id="grpLive"></div>
        <div class="seg" id="segLive"></div>
        <div class="seg" id="segStrength"></div>
        <div class="seg" id="segPlay"></div></div>
      <div class="grp"><div class="grplab" id="grpFcst"></div>
        <div class="seg" id="segFcst"></div>
        <div class="slwrap"><input type="range" id="slider" min="0" max="18" step="1" value="9" aria-label="hour"><div class="sltime" id="slTime"></div></div>
        <div class="sub" id="slNote"></div>
        <div class="wread" id="windRead" hidden></div></div>
    </div>
    <div id="mapwrap"><div id="mapbox"></div><div class="rail rail-l" aria-hidden="true"></div><div class="rail rail-r" aria-hidden="true"></div><div id="mapTimes"></div><button id="fsExit" hidden></button></div>
    <div class="legend" id="legend"></div>
    <div class="lsrc" id="liveSrc"></div>
    
  </section>

  <section class="blk" id="towns">
    <h2 id="townsHead"></h2>
    <p class="sub" id="townsSub"></p>
    <div id="townList"></div>
  </section>

  <section class="blk" id="guide">
    <h2 id="guideHead"></h2>
    <div id="guideBody"></div>
  </section>
  <section class="blk" id="share">
    <h2 id="shareHead"></h2>

  gAuto:'自动检测怎么判断',
  gAutoBody:'每 5 分钟，软件读取最新的新加坡雷达图（480 公里范围）；雷达照不到的地方（主要是海峡北部）改用日本气象厅的强雨域推定。只看海峡中线两侧 120 公里以内。雷达颜色：青 = 小雨，绿 = 中雨，黄、橙、红、紫 = 大雨；强雨域推定的色块算大雨。把中雨以上的格点（约 5.5 公里一格，容许 11 公里以内的空隙）连成一片：面积至少 800 平方公里、长至少 100 公里、长宽比至少 2.5、走向大致南北到西北—东南，就判为「雷雨带」。与 30 分钟前的图比较，向马来西亚方向移动每小时至少 10 公里，就判为「正在接近」，并按这个速度从雨带前缘算出各城镇的到达时间（超过 6 小时不报时刻）。中雨以上面积少于 300 平方公里算「海峡平静」。能看到的范围不到海峡的 30% 时不作判断。',

  dayRainAt:(t,d,st,mx,mh,dry)=>`${t}：模型显示${d} ${st} 起有雨（最大约 ${mx} mm/h，${mh} 前后）。${dry ? `在那之前是干的——喷药要早，喷完到 ${dry} 之间要留够药剂标签写的耐雨时间。` : '早上就有雨，喷药改到雨停以后，或改天。'}模型的时间常差一两个小时。`,

  eastNote:'苏门答腊飑线到不了东马——中间隔着约 700 km 的南中国海。这里列出的是模型对当地同一时段的雷雨信号，属于东马本身的夜间/清晨雷暴（多在海上形成、早上移上岸），不是苏门答腊飑线。',

  guideHead:'说明',
  gWhat:'苏门答腊飑线是什么',
  gWhatBody:'一条南北向排开、长达数百公里的雷暴带。它多在午夜后于苏门答腊东岸或马六甲海峡上空形成，被西南到西风推着向东移，凌晨到上午扫过半岛西海岸。来时往往先起一阵强风（常见 40–80 km/h），随后是大雨和雷电，通常一两个小时内就过去。',
  gWhy:'为什么总在凌晨',
  gWhyBody:'夜里陆地降温比海快，苏门答腊和半岛两岸都吹出「陆风」，吹向较暖的海峡，在海上相遇——空气只能往上走。海峡上空暖湿、不稳定，抬升的空气就长成雷暴，再排成一条线。高一层的西南风（850–700 百帕）把这条线推向马来西亚。',
  gWhen:'什么季节',
  gWhenBody:'多见于西南季风期（约 5–9 月）和前后的季风过渡期（4 月、10–11 月）；东北季风期（12–3 月）引导风多是东风，很少出现。下图的深浅就是本软件用的季节分数。',
  gWhere:'影响哪里',
  gWhereBody:'主要是半岛西海岸，从霹雳到柔佛，尤其雪兰莪至柔佛一带（以及新加坡）。越过蒂迪旺沙山脉后通常减弱，有时仍以较弱的雷雨到达彭亨内陆；东海岸较少受影响。',
  gEast:'东马呢',
  gEastBody:'苏门答腊飑线不会到达沙巴、砂拉越。东马有自己的夜间雷暴：陆风在近岸海上辐合形成，早上可能移上岸。本软件在「城镇」里仍列出东马各地的模型信号，但明确标为本地雷暴。',
  gImpact:'对农场和生活的影响',
  gImpactBody:'突发强阵风会折断树枝、吹倒香蕉等浅根作物、吹落榴莲果；大雨冲掉刚喷的药；雷电危及户外作业；海上渔船和海峡航运也受影响。好在它来得快、去得也快。',
  gSat:'在卫星图上认出飑线',
  gSatBody:'向日葵 9 号每 10 分钟拍一次全圆盘。红外（第 13 波段）量的是云顶温度：云顶越冷越白，说明云越高、对流越强。苏门答腊飑线在图上是一条南北走向、由多个很白的云团连成的带，凌晨在海峡上出现，一帧一帧往东移。播放最近两小时的图，就能看出它移动的方向和速度。「强雨域推定」是日本气象厅根据卫星数据估算的强降雨区，比单看云顶更接近地面雨量，但仍是估算。卫星看不到云底下的实际雨量，也不一定分得清厚卷云和雷暴，所以要和模型一起看。',
  gRadar:'新加坡雷达',
  gRadarBody:'大马本地雷达属于大马气象局，本软件不使用。新加坡国家环境局（NEA）通过 data.gov.sg 公开雷达图（以新加坡为中心，480 公里与 240 公里范围，每 5 分钟一张），采用新加坡开放数据许可。480 公里范围大约到霹雳南部和对岸的苏门答腊东岸，所以看得到海峡中南部飑线的形成和移动；北部（吉打、槟城、霹雳北部）超出范围，只能靠卫星。离雷达越远，雷达波束越高，远处较低的雨可能看不到。',
  gHow:'怎么用这个软件',

  gCredits:'数据来源与致谢',

  lvNote:'This is the app reading the pictures automatically — it can miss a storm or raise a false alarm. The thresholds are in Guide → How the automatic check works.',
  gAuto:'How the automatic check works',
  gAutoBody:'Every 5 minutes the app reads the latest Singapore radar picture (480 km range); where the radar cannot see (mainly the northern Strait) it uses JMA Heavy Rain Potential instead. It only looks within 120 km of the Strait mid-line. Radar colours: cyan = light, green = moderate, yellow, orange, red, magenta = heavy; a Heavy Rain Potential patch counts as heavy. Cells of moderate-or-heavier rain (about 5.5 km each, gaps up to 11 km allowed) are joined together; a group at least 800 km² in area, at least 100 km long, at least 2.5 times longer than wide and lying roughly north–south to north-west–south-east is called a "storm band". Compared with the picture 30 minutes earlier, if it moves toward Malaysia at 10 km/h or more it is "approaching", and arrival times for each town are worked out from its leading edge at that speed (no clock time beyond 6 hours). Less than 300 km² of moderate-or-heavier rain is "Strait calm". If less than 30% of the Strait can be seen, no call is made.',

  guideHead:'Guide',
  gWhat:'What a Sumatra squall is',
  gWhatBody:'A north–south line of thunderstorms, often hundreds of kilometres long. It usually forms after midnight over Sumatra\'s east coast or the Strait of Malacca and is pushed east by south-westerly to westerly winds, sweeping the Peninsula\'s west coast between the small hours and mid-morning. It arrives with a sudden strong wind (commonly 40–80 km/h), then heavy rain and lightning, and usually passes within an hour or two.',
  gWhy:'Why before dawn',
  gWhyBody:'At night land cools faster than the sea, so both Sumatra and the Peninsula blow a land breeze toward the warmer Strait. The two meet at sea and the air has nowhere to go but up. Over the warm, moist, unstable Strait, that lifted air grows into thunderstorms that organise into a line, and the south-westerly wind a little higher up (850–700 hPa) pushes the line toward Malaysia.',
  gWhen:'Which season',
  gWhenBody:'Most common in the south-west monsoon (about May–September) and the inter-monsoon months either side (April, October–November). In the north-east monsoon (December–March) the steering wind is mostly easterly and squalls are rare. The shading below is the season score this app uses.',
  gWhere:'Where it hits',
  gWhereBody:'Mainly the Peninsula\'s west coast from Perak to Johor, especially Selangor to Johor (and Singapore). Squall lines usually weaken after crossing the Titiwangsa range, sometimes still reaching interior Pahang as weaker storms; the east coast is less affected.',
  gEast:'What about East Malaysia',
  gEastBody:'Sumatra squalls do not reach Sabah or Sarawak. East Malaysia has its own night-time storms, formed where land breezes converge just offshore, which can move ashore in the morning. The Towns section still lists the model signal for East Malaysian towns, clearly labelled as local storms.',
  gImpact:'Effects on farms and daily life',
  gImpactBody:'Sudden strong gusts break branches, flatten shallow-rooted crops such as bananas and knock durians down; heavy rain washes off fresh spray; lightning endangers outdoor work; fishing boats and shipping in the Strait are affected too. The good news: it comes fast and goes fast.',
  gSat:'Spotting a squall line on the satellite',
  gSatBody:'Himawari-9 images the full disk every 10 minutes. Infrared (band 13) measures cloud-top temperature: the colder and whiter the top, the taller and stronger the storm. A Sumatra squall shows up as a north–south band of bright white cloud clusters that appears over the Strait before dawn and steps east frame by frame. Play the last two hours to see its direction and speed. Heavy Rain Potential is the JMA estimate of heavy-rain areas from satellite data — closer to rain at the ground than cloud tops alone, but still an estimate. The satellite cannot see the rain under the cloud and cannot always tell thick cirrus from a thunderstorm, so read it together with the model.',
  gRadar:'Singapore radar',
  gRadarBody:'Malaysia\'s own radar belongs to MET Malaysia and is not used by this app. Singapore\'s National Environment Agency (NEA) publishes its radar images (centred on Singapore, 480 km and 240 km ranges, every 5 minutes) through data.gov.sg under the Singapore Open Data Licence. The 480 km range reaches roughly southern Perak and the Sumatra coast opposite, so it sees squall lines form and cross the central and southern Strait; the north (Kedah, Penang, northern Perak) is out of range and relies on the satellite. Far from the radar the beam is high, so distant low rain can be missed.',
  gHow:'How to use this app',
  gHowSteps:['In the evening, read "Tonight": the level and the advice are the default plan.','Every point of the index can be opened to show the arithmetic and thresholds.','You do not need to read the radar yourself: "The Strait right now" at the top reads it every 5 minutes and, when it finds a storm band, gives its position, speed and arrival time for each town, and draws it as a thick red line on the map.','"Towns" lists each place\'s earliest model signal and peak gust.'],
  gLimits:'Limits',
  gLimitsBody:'Model grids (ECMWF 9 km, GFS about 25 km) are too coarse to draw the squall line itself; timing is often an hour or two off, and a squall can be missed or falsely shown. The index only says whether the ingredients are in place. The Himawari satellite shows what is happening, though it sees cloud tops, not rain gauges; MET Malaysia is the authority for warnings.',
  gThr:'All thresholds',
  gCredits:'Data sources and credits',
  gCreditsBody:'Model: Open-Meteo (CC BY 4.0), from ECMWF IFS and NOAA GFS. Radar: Singapore National Environment Agency (NEA) via data.gov.sg, Singapore Open Data Licence. Satellite: Japan Meteorological Agency (JMA) Himawari-9 — band 13 infrared imagery and Heavy Rain Potential. Base map: © Esri, HERE, Garmin, © OpenStreetMap contributors; coastline: JMA. For weather warnings see MET Malaysia (met.gov.my).',
  dg:{sum:'Sumatra',strait:'Strait of Malacca',pen:'Peninsula',lb:'land breeze',steer:'steering wind (SW → NE)',t1:'~00–03 forms',t2:'~03–06 crosses',t3:'~05–10 west coast',mt:'Titiwangsa'},

  gAuto:'Cara semakan automatik berfungsi',
  gAutoBody:'Setiap 5 minit perisian membaca imej radar Singapura terkini (julat 480 km); di kawasan yang radar tidak nampak (terutamanya utara Selat) ia menggunakan Anggaran Hujan Lebat JMA. Ia hanya melihat dalam 120 km dari garis tengah Selat. Warna radar: sian = ringan, hijau = sederhana, kuning, jingga, merah, magenta = lebat; tompok Anggaran Hujan Lebat dikira lebat. Sel hujan sederhana atau lebih lebat (kira-kira 5.5 km setiap satu, jurang sehingga 11 km dibenarkan) dicantumkan; kumpulan yang luasnya sekurang-kurangnya 800 km², panjang sekurang-kurangnya 100 km, sekurang-kurangnya 2.5 kali lebih panjang daripada lebar dan terletak kira-kira utara–selatan hingga barat laut–tenggara dikira "jalur ribut". Berbanding imej 30 minit lebih awal, jika ia bergerak ke arah Malaysia 10 km/j atau lebih, ia "menghampiri", dan masa tiba bagi setiap bandar dikira dari tepi hadapannya pada kelajuan itu (tiada masa jam melebihi 6 jam). Kurang daripada 300 km² hujan sederhana atau lebih lebat dikira "Selat tenang". Jika kurang 30% Selat dapat dilihat, tiada keputusan dibuat.',

/* ---------- state ---------- */
const S = {
  lang: null, size: 0, model: 'ecmwf', night: 0, hourPos: 9,
  layers: { nea: true, sat: true, hrp: false, w850: false, w10: false, rain: false, conv: false, towns: true }, strength: 1,
  D: null, err: null, townErr: null, fallbackNote: null, loading: false, A: null,
};
const SIZES = [17, 19, 21];
function T(key, ...args) { const v = I18N[S.lang || 'zh'][key]; return typeof v === 'function' ? v(...args) : v; }
const $ = id => document.getElementById(id);
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c])); }
function tname(t) { return t[S.lang || 'zh'] || t.en; }
function hhmm(ts) { const p = mytParts(ts); return String(p.h).padStart(2, '0') + ':' + String(p.mi).padStart(2, '0'); }
function dirName(deg) { return T('dirs')[Math.round(((deg % 360) + 360) % 360 / 45) % 8]; }
function monthName(mo) { return S.lang === 'zh' ? MON_ZH(mo) : S.lang === 'ms' ? MON_MS[mo - 1] : MON_EN[mo - 1]; }
function nowSec() { return Math.floor(Date.now() / 1000); }
function f1(x) { return (Math.round(x * 10) / 10).toFixed(1); }

/* ---------- data ---------- */
const MODELS = {
  // Grid needs 850/700 hPa winds: Open-Meteo's ECMWF 9 km run returns them all null (checked live 2026-09-24),
  // so the grid uses the 0.25° run; towns use 9 km for sharper local rain and gusts.
  ecmwf: { label: 'ECMWF', grid: ['ecmwf_ifs025'], towns: ['ecmwf_ifs', 'ecmwf_ifs025'], names: { ecmwf_ifs:'ECMWF IFS 9 km', ecmwf_ifs025:'ECMWF IFS 0.25°' } },
  gfs:   { label: 'GFS',   grid: ['gfs_seamless'], towns: ['gfs_seamless'], names: { gfs_seamless:'NOAA GFS' } },
};
const GVARS = ['wind_speed_10m','wind_direction_10m','wind_gusts_10m','precipitation','cape','wind_speed_850hPa','wind_direction_850hPa','wind_speed_700hPa','wind_direction_700hPa'];
const GKEYS = { wind_speed_10m:'ws10', wind_direction_10m:'wd10', wind_gusts_10m:'gu10', precipitation:'pr', cape:'cape', wind_speed_850hPa:'ws850', wind_direction_850hPa:'wd850', wind_speed_700hPa:'ws700', wind_direction_700hPa:'wd700' };
const TVARS = ['precipitation','wind_gusts_10m','cape'];
const TKEYS = { precipitation:'pr', wind_gusts_10m:'gu', cape:'cape' };

function omURL(pts, vars, model, cell) {
  return 'https://api.open-meteo.com/v1/forecast?latitude=' + pts.map(p => p.lat).join(',') + '&longitude=' + pts.map(p => p.lon).join(',') +
    '&hourly=' + vars.join(',') + '&models=' + model + '&timezone=GMT&timeformat=unixtime&past_days=1&forecast_days=3&wind_speed_unit=kmh' + (cell ? '&cell_selection=' + cell : '');
}
async function fetchJSON(url, tries = 2) {
  let lastErr = null;
  for (let a = 0; a < tries; a++) {
    const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), FETCH_TIMEOUT_MS);
    try {
      const r = await fetch(url, { signal: ctl.signal, cache: 'no-store' });
      if (r.ok) { const j = await r.json(); clearTimeout(tm); return j; }   // a body that stalls is aborted too
      let why = 'HTTP ' + r.status;
      try { const j = await r.json(); if (j && j.reason) why += ' — ' + j.reason; } catch (e) {}
      clearTimeout(tm);
      lastErr = new Error(why); lastErr.status = r.status;
      if (r.status !== 429 && r.status !== 503) break;
    } catch (e) { clearTimeout(tm); lastErr = new Error(e.name === 'AbortError' ? 'timeout 30 s' : (e.message || 'network error')); }
    if (a < tries - 1) await new Promise(res => setTimeout(res, 2000 + Math.random() * 2000));   // jittered cooldown before the retry
  }
  throw lastErr;
}
/** Open-Meteo multi-location → { times, series:{key:[point][hour]} } */
function parseMulti(json, n, keymap) {
  const arr = Array.isArray(json) ? json : [json];
  if (arr.length !== n) throw new Error('expected ' + n + ' points, got ' + arr.length);
  const times = arr[0].hourly && arr[0].hourly.time;
  if (!times || !times.length) throw new Error('no hourly times');
  const series = {};
  for (const [v, key] of Object.entries(keymap)) series[key] = arr.map(o => (o.hourly && o.hourly[v]) ? o.hourly[v] : times.map(() => null));
  return { times, series };
}
function buildD(model, modelId, at, g, t) {
  const D = { model, modelId, at, times: g.times, grid: g.series, towns: null, idx: new Map() };
  g.times.forEach((ts, i) => D.idx.set(ts, i));
  if (t) {
    const off = new Map(t.times.map((ts, i) => [ts, i]));
    D.towns = {};
    TOWNS.forEach((tw, n) => {
      const o = {};
      for (const key of Object.values(TKEYS)) o[key] = D.times.map(ts => { const i = off.get(ts); return i == null ? null : t.series[key][n][i]; });
      D.towns[tw.id] = o;
    });
  }
  return D;
}
async function tryIds(ids, fn) {
  let lastErr = null;
  for (let i = 0; i < ids.length; i++) {
    try { return { v: await fn(ids[i]), id: ids[i], i }; }
    catch (e) { lastErr = e; if (e.status !== 400) break; }   // only a rejected model/variable (400) tries the next id; a busy server does not
  }
  throw lastErr;
}
/** variables that came back with no value at all — shown loudly instead of silently dropping an ingredient */
function nullVars(series, keymap) {
  return Object.entries(keymap).filter(([v, k]) => series[k].every(arr => arr.every(x => x == null))).map(([v]) => v);
}
async function loadModel(model) {
  const M = MODELS[model];
  const G = await tryIds(M.grid, id => fetchJSON(omURL(GPTS, GVARS, id, 'nearest')).then(j => parseMulti(j, GPTS.length, GKEYS)));
  let t = null, townErr = null, townId = null;
  try { const R = await tryIds(M.towns, id => fetchJSON(omURL(TOWNS, TVARS, id, null)).then(j => parseMulti(j, TOWNS.length, TKEYS))); t = R.v; townId = R.id; }
  catch (e) { townErr = e.message; }
  const empty = nullVars(G.v.series, GKEYS).concat(t ? nullVars(t.series, TKEYS).map(v => v + ' (towns)') : []);
  return { raw: { model, modelId: G.id, townId, at: Date.now(), g: G.v, t, empty }, fell: G.i > 0 ? [M.names[M.grid[0]], M.names[G.id]] : null, townErr };
}
function cacheKey(model) { return LSK.cache + model; }

async function refresh(force) {
  if (S.loading) { S.pending = true; return; }          // a model switch during a load is replayed when it finishes
  const model = S.model;
  const cached = lsGet(cacheKey(model), null);
  if (!force && cached && (Date.now() - cached.at) < MIN_RELOAD_MIN * 60000) { useRaw(cached); S.err = null; renderAll(); return; }
  S.loading = true; S.pending = false; renderFresh();
  let res = null, err = null;
  try { res = await loadModel(model); } catch (e) { err = e.message || String(e); }
  if (res) lsSet(cacheKey(model), res.raw);             // always filed under the model it came from
  S.loading = false;
  if (S.model !== model) { refresh(false); return; }     // user switched meanwhile: this result is not for the screen
  if (res) { S.fallbackNote = res.fell; S.err = null; S.townErr = res.townErr || null; useRaw(res.raw); }
  else { S.err = err; if (cached) useRaw(cached); }
  renderAll();
  loadHome(false);
  if (S.pending) { S.pending = false; refresh(false); }
}
function useRaw(raw) {
  S.D = buildD(raw.model, raw.modelId, raw.at, raw.g, raw.t); S.D.townId = raw.townId || null; S.D.empty = raw.empty || [];
  const h = homeTown(), c = h && h.custom ? lsGet(LSK.homeCache + raw.model, null) : null;
  if (homeCacheOk(c, h, raw.model, S.D.townId || MODELS[raw.model].towns[0])) attachHome(c);   // no flicker, but never a stale or foreign point
}

/* ---------- rendering ---------- */
function analyze() {
  if (!S.D) { S.A = null; return; }
  const M0 = nightMorning(nowSec(), S.night), ageH = (Date.now() - S.D.at) / 3600000;
  if (ageH > STALE_H) { S.A = { M0, score: null, level: null, blocked: 'stale', ageH, towns: [], parts: null }; return; }
  S.A = analyzeNight(S.D, M0); S.A.strip = stripData(S.D, M0);
}
function renderAll() { analyze(); renderStatic(); renderFresh(); renderSettings(); renderLive(); renderVerdict(); renderMine(); renderTowns(); renderMapAll(); }

function renderStatic() {
  document.documentElement.lang = S.lang === 'ms' ? 'ms' : S.lang === 'en' ? 'en' : 'zh';
  document.documentElement.style.setProperty('--fs', SIZES[S.size] + 'px');
  $('appTitle').textContent = T('appTitle');
  const installed = window.matchMedia && (matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: minimal-ui)').matches);
  document.title = installed ? APP_NAME : T('appTitle');   // installed: title bar shows the name once, not "name - title"
  $('btnLang').textContent = T('langShort');
  $('btnSize').title = T('aaTitle'); $('btnSize').setAttribute('aria-label', T('aaTitle'));
  $('liveHead').textContent = T('liveHead');
  for (const k of ['navVerdict','navMap','navTowns','navGuide','setTitle','setNight','setModel','setHome','advHead','stripHead','stripSub','ingHead','disc','mapHead','mapSub','slNote','townsHead','townsSub','guideHead'])
    $(k).textContent = T(k);
  $('foot').textContent = T('foot', VERSION);
  $('shareHead').textContent = T('shareHead'); $('shareSub').textContent = T('shareSub');
  $('lnkWa').textContent = T('shareWa'); $('lnkWa').href = 'https://wa.me/?text=' + encodeURIComponent(T('shareMsg', APP_URL));
  $('btnCopy').textContent = T('shareCopy');
  if (S.guideLang !== S.lang) { renderGuide(); S.guideLang = S.lang; }
}

function renderFresh() {
  const b = $('banner'), f = $('fresh'), btn = $('btnReload');
  let html = '';
  if (S.fallbackNote) html += `<div class="banner amber">${esc(T('modelFallback', ...S.fallbackNote))}</div>`;
  if (S.err && !S.D) html += `<div class="banner red">${esc(T('errNoData', S.err))}</div>`;
  else if (S.err && S.D) html += `<div class="banner amber">${esc(T('errCache', S.err, hhmm(Math.floor(S.D.at / 1000))))}</div>`;
  if (S.D && S.D.empty && S.D.empty.length) html += `<div class="banner amber">${esc(T('emptyVars', S.D.empty.join(', ')))}</div>`;
  if (S.townErr && S.D) html += `<div class="banner amber">${esc(T('townErr', S.townErr))}</div>`;
  if (S.D) { const ageH = (Date.now() - S.D.at) / 3600000; if (ageH > STALE_H) html += `<div class="banner red">${esc(T('stale', Math.floor(ageH)))}</div>`; }
  b.innerHTML = html;
  if (S.D) {
    const mins = Math.round((Date.now() - S.D.at) / 60000);
    const ago = mins < 90 ? T('agoMin', mins) : T('agoH', Math.round(mins / 60));
    const Mn = MODELS[S.D.model].names, gName = Mn[S.D.modelId] || S.D.modelId;
    const mName = S.D.townId && S.D.townId !== S.D.modelId ? gName + ' + ' + (Mn[S.D.townId] || S.D.townId) : gName;
    f.textContent = T('fresh', mName, hhmm(Math.floor(S.D.at / 1000)), ago);
  } else f.textContent = S.loading ? T('loading') : '';

function reasonsFor(A) {
  const P = A.parts, out = [];
  if (!P.steer.missing) {
    const k = Math.round(P.steer.st.spd * 3.6);
    if (P.steer.df === 0) out.push(T('rSteerWrong', dirName(P.steer.st.from), Math.round(P.steer.st.from)));
    else if (P.steer.sf < 0.35) out.push(T('rSteerSlow', k));
    else if (P.steer.df >= 0.5) out.push(T('rSteerGood', dirName(P.steer.st.from), k));
  }
  if (!P.rain.missing) { if (P.rain.score >= 0.5) out.push(T('rRainHi', Math.round(P.rain.frac * 100))); else if (P.rain.score <= 0.1) out.push(T('rRainLo')); }
  if (!P.conv.missing) { if (P.conv.score >= 0.6) out.push(T('rConvHi')); else if (P.conv.score <= 0.1) out.push(T('rConvLo')); }
  if (!P.cape.missing) { const c = Math.round(P.cape.c / 50) * 50; if (P.cape.score >= 0.6) out.push(T('rCapeHi', c)); else if (P.cape.score <= 0.15) out.push(T('rCapeLo', c)); }
  if (!P.gust.missing && P.gust.score >= 0.5) out.push(T('rGustHi', Math.round(P.gust.g), tname(P.gust.town), hhmm(P.gust.ts)));
  return out.slice(0, 4).join(S.lang === 'zh' ? '' : ' ');
}

function renderVerdict() {

  $('vNight').textContent = (T('nightRel')[rel] || '') + '  ' + T('nightDate', mytParts(M0 - 86400), mytParts(M0));
  if (!A || A.score == null) {

    $('vReason').textContent = !A || S.loading ? '' : A.blocked === 'stale' ? T('blkStale', Math.floor(A.ageH)) : A.blocked === 'missing' ? T('blkMissing', A.lacking.map(k => T('ing')[k]).join(S.lang === 'zh' ? '、' : ', ')) : T('nightNoData');
    $('vEarly').hidden = true; $('adv').innerHTML = ''; $('strip').innerHTML = ''; $('stripKey').innerHTML = ''; $('ing').innerHTML = ''; return;
  }

  let reason = reasonsFor(A);
  if (A.gate) reason += (reason ? ' ' : '') + T('gateNote');
  if (A.missing.length) reason += ' ' + T('missingNote', A.missing.map(k => T('ing')[k]).join(S.lang === 'zh' ? '、' : ', '));
  $('vReason').textContent = reason;

  else $('vEarly').hidden = true;
  // advice window: from earliest west-coast signal to latest first-signal + 2 h, else default
  // nobody sprays at 2 am: the advice talks about the morning work hours. A storm window that closes before work
  // starts gets "carry on, but check the live panel first" instead of "hold off".
  const ws = A.M0 + THR.workStart * 3600, we = A.M0 + THR.workEnd * 3600;
  let win = hhmm(ws) + '–' + hhmm(we), early = false;
  const firsts = A.towns.filter(r => r.town.g === 'west' && r.first != null).map(r => r.first);
  if (firsts.length) {
    const a = Math.min(...firsts), b = Math.min(Math.max(...firsts) + 7200, A.M0 + 12 * 3600);
    if (b <= ws) { early = true; win = hhmm(a) + '–' + hhmm(b); } else win = hhmm(Math.max(a, ws)) + '–' + hhmm(b);
  }
  const relDay = Math.round((A.M0 - mytMidnight(nowSec())) / 86400), day = T('mornWord')[relDay] || T('mornWord')[1];
  const adv = (A.level === 'low' ? T('advLow') : A.level === 'watch' ? T('advWatch', win, day, early) : T('advLikely', win, day, early)).slice();
  adv.splice(1, 0, dayRainAdvice(A.M0, relDay));   // the rest of the working day, right after the squall default
  $('adv').innerHTML = adv.map(s => `<li>${esc(s)}</li>`).join('');
  renderStrip(); renderIngredients();
}

const FRAC_COL = [[0.02,'#e3eaee'],[0.1,'#c3d5f2'],[0.2,'#86a9e6'],[0.35,'#4f6fd0'],[0.5,'#3b2f9e'],[2,'#23145f']];
function fracColor(f) { if (f == null) return '#f4f4f4'; for (const [lim, c] of FRAC_COL) if (f < lim) return c; return '#23145f'; }
/** three kinds, each drawn differently so they can never look alike:
    good  = strong enough AND blowing toward Malaysia → red, length grows with speed

function arrowKind(st) { return st.spd < THR.steerSpdZero ? 'weak' : dirFactor(st.from) > 0 ? 'good' : 'wrong'; }
const ARROW_COL = { good: '#b42318', weak: '#9aabb6', wrong: '#34495a' };

}
function arrowSVG(st) {

}
/** legend sample: the very same drawing as in the strip */
function arrowKey(kind, to) { return `<svg class="akey" viewBox="0 0 24 24" aria-hidden="true">${arrowPath(kind, to, 8)}</svg>`; }
/** spray advice for the rest of the day: the user's own area, or a west-coast summary until one is chosen */
function dayRainAdvice(M0, relDay) {

    if (r.first == null) return T('dayDry', tname(home), dw);
    const dryTo = r.first > M0 + THR.workStart * 3600 ? hhmm(r.first) : null;
    return T('dayRainAt', tname(home), dw, hhmm(r.first), f1(r.max), hhmm(r.maxT), dryTo);
  }
  const rs = TOWNS.filter(t => t.g !== 'east').map(t => ({ t, r: dayRain(D, t.id, M0) })).filter(x => x.r);

  else if (b.dataset.lang) { setLang(b.dataset.lang); $('langOvl').hidden = true; }
  else if (b.dataset.homepick) showHomePicker();
  else if (b.dataset.home) { S.home = b.dataset.home; lsSet(LSK.home, S.home); if (S.D && S.D.towns) delete S.D.towns.home; S.homeReq = (S.homeReq || 0) + 1; $('homeOvl').hidden = true; renderAll(); $('mine').scrollIntoView({ behavior: 'smooth' }); }
  else if (b.id === 'homeClose') $('homeOvl').hidden = true;
});
$('btnReload').onclick = () => refresh(true);
$('btnGps').onclick = () => {
  if (!navigator.geolocation) { $('homeMsg').textContent = T('gpsNo'); return; }
  $('homeMsg').textContent = T('gpsWait');
  navigator.geolocation.getCurrentPosition(
    p => setCustomHome(p.coords.latitude, p.coords.longitude, 'gps'),
    e => { $('homeMsg').textContent = e.code === 1 ? T('gpsDenied') : T('gpsFail', e.message || ('code ' + e.code)); },
    { enableHighAccuracy: false, timeout: 20000, maximumAge: 10 * 60000 });
};
$('btnCoord').onclick = () => { const c = parseCoords($('inLat').value, $('inLon').value); if (!c) $('homeMsg').textContent = T('coordBad'); else setCustomHome(c.lat, c.lon, 'manual'); };
$('btnCopy').onclick = async () => {
  let done = false;
  try { await navigator.clipboard.writeText(APP_URL); done = true; } catch (e) {
    const ta = document.createElement('textarea'); ta.value = APP_URL; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); try { done = document.execCommand('copy'); } catch (e2) {} ta.remove();
  }
  $('copyMsg').textContent = done ? T('shareCopied') : T('shareCopyFail', APP_URL);
};
$('btnLang').onclick = () => { showLangPicker(); };
$('btnSize').onclick = () => { S.size = (S.size + 1) % SIZES.length; lsSet(LSK.size, S.size); renderStatic(); if (MAP.m) MAP.m.invalidateSize(); };
function ensureForecastLayer() {
  if (FCST_LAYERS.some(k => S.layers[k])) return;
  S.layers.w850 = true; S.layers.rain = true; lsSet(LSK.layers, S.layers); S.autoOn = true; renderMapControls();
}
$('slider').addEventListener('input', e => {
  S.hourPos = +e.target.value; $('slTime').textContent = sliderLabel();
  ensureForecastLayer(); renderModelLayers();
});

function showLangPicker() {
  $('pickLang').textContent = S.lang ? ({ zh:'请选择语言', en:'Choose language', ms:'Pilih bahasa' })[S.lang] : '请选择语言 · Choose language · Pilih bahasa';
  $('pickLangSub').textContent = S.lang ? T('pickLangSub') : '';
  document.querySelectorAll('#langOvl .lbtn').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === S.lang)));
  $('langOvl').hidden = false;
}
/* ---------- my area: a listed town, or the user's own coordinates (GPS or typed) ---------- */
function inCover(la, lo) { return isFinite(la) && isFinite(lo) && la >= 0.5 && la <= 7.6 && lo >= 99.3 && lo <= 119.6; }   // Peninsula + Sabah/Sarawak
function validHome(h) { return (typeof h === 'string' && TOWNS.some(t => t.id === h)) || (!!h && typeof h === 'object' && inCover(h.lat, h.lon)); }
function homeTown() {
  if (!S.home) return null;
  if (typeof S.home === 'string') return TOWNS.find(t => t.id === S.home) || null;
  return { id: 'home', g: S.home.lon > 108 ? 'east' : 'west', lat: S.home.lat, lon: S.home.lon, zh: '我的位置', en: 'My location', ms: 'Lokasi saya', custom: true };
}
/** "3.251, 102.423" pasted into either box (e.g. from Google Maps) or one number per box */
function parseCoords(a, b) { const m = (String(a) + ' ' + String(b || '')).match(/-?\d+(?:\.\d+)?/g); return m && m.length >= 2 ? { lat: +m[0], lon: +m[1] } : null; }
function setCustomHome(la, lo, src) {
  la = Math.round(la * 1000) / 1000; lo = Math.round(lo * 1000) / 1000;          // ~100 m: plenty for a 9 km model, less precise to store
  if (!inCover(la, lo)) { $('homeMsg').textContent = T('coordOut'); return false; }
  S.home = { lat: la, lon: lo, src }; S.homeErr = null; lsSet(LSK.home, S.home);
  if (S.D && S.D.towns) delete S.D.towns.home;           // the previous point's rain must not show under the new point
  $('homeOvl').hidden = true; renderAll(); loadHome(true); $('mine').scrollIntoView({ behavior: 'smooth' }); return true;
}
/** the model's hourly rain for the user's own point (one extra Open-Meteo location, cached like the rest) */
function attachHome(c) {
  if (!S.D) return; if (!S.D.towns) S.D.towns = {};
  const off = new Map(c.t.times.map((ts, i) => [ts, i])), o = {};
  for (const key of Object.values(TKEYS)) o[key] = S.D.times.map(ts => { const i = off.get(ts); return i == null ? null : c.t.series[key][0][i]; });
  S.D.towns.home = o;
}
function homeCacheOk(c, h, model, id) {   // same point, same model run, and not older than the main forecast allows
  return !!c && !!h && c.lat === h.lat && c.lon === h.lon && c.model === model && c.id === id && (Date.now() - c.at) / 3600000 <= STALE_H;
}
async function loadHome(force) {
  const h = homeTown(); if (!h || !h.custom || !S.D) return;
  const model = S.D.model, id = S.D.townId || MODELS[model].towns[0], key = LSK.homeCache + model;
  let c = lsGet(key, null);
  const same = homeCacheOk(c, h, model, id);
  if (same) attachHome(c);
  if (!force && same && Date.now() - c.at < MIN_RELOAD_MIN * 60000) return;
  const req = S.homeReq = (S.homeReq || 0) + 1;         // only the newest request may land
  S.homeLoading = true; S.homeErr = null;
  let t = null, err = null;
  try { t = parseMulti(await fetchJSON(omURL([h], TVARS, id, null)), 1, TKEYS); } catch (e) { err = e.message || String(e); }
  const cur = homeTown();
  if (req !== S.homeReq || !cur || !cur.custom || cur.lat !== h.lat || cur.lon !== h.lon || !S.D || S.D.model !== model) return;   // superseded: drop it
  if (t) { c = { lat: h.lat, lon: h.lon, model, id, at: Date.now(), t }; lsSet(key, c); attachHome(c); } else S.homeErr = err;
  S.homeLoading = false; renderAll();
}
function showHomePicker() {
  $('btnGps').textContent = T('gpsBtn'); $('btnCoord').textContent = T('coordUse');
  $('latLab').textContent = T('latLab'); $('lonLab').textContent = T('lonLab');
  $('coordHint').textContent = T('coordHint'); $('homePriv').textContent = T('homePriv'); $('homeMsg').textContent = '';
  const h = homeTown(); $('inLat').value = h && h.custom ? h.lat : ''; $('inLon').value = h && h.custom ? h.lon : '';
  $('homeHead').textContent = T('homeHead'); $('homeClose').textContent = T('homeClose');
  $('homeList').innerHTML = ['west', 'inland', 'east'].map(g => `<h3>${esc(T('grp')[g])}</h3><div class="seg">` +
    TOWNS.filter(t => t.g === g).map(t => `<button data-home="${t.id}" aria-pressed="${S.home === t.id}">${esc(tname(t))}</button>`).join('') + '</div>').join('');
  $('homeOvl').hidden = false;
}
function setLang(l) { S.lang = l; lsSet(LSK.lang, l); renderAll(); }
function setDefaultHour() {
  const M0 = nightMorning(nowSec(), S.night), now = nowSec();
  S.hourPos = (now >= M0 - 6 * 3600 && now <= M0 + 12 * 3600) ? Math.floor((now - (M0 - 6 * 3600)) / 3600) : 9;   // 9 = 03:00
}

/* scroll-spy for the bottom nav */
function spy() {
  const ids = ['verdict', 'map', 'towns', 'guide']; let on = 'verdict';
  for (const id of ids) { const r = $(id).getBoundingClientRect(); if (r.top < window.innerHeight * 0.35) on = id; }
  document.querySelectorAll('.navb').forEach(b => b.classList.toggle('on', b.dataset.go === on));
}
window.addEventListener('scroll', () => requestAnimationFrame(spy), { passive: true });

/* ---------- service worker (announce updates, never auto-apply) ---------- */
function initSW() {
  if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;
  navigator.serviceWorker.register('sw.js').then(reg => {
    const offer = w => { const t = $('toast'); t.textContent = T('updReady'); t.hidden = false; t.onclick = () => { w.postMessage('skipWaiting'); }; };
    if (reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
    reg.addEventListener('updatefound', () => { const w = reg.installing; if (!w) return; w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) offer(w); }); });
    let last = 0; const check = () => { if (Date.now() - last > 60000) { last = Date.now(); reg.update().catch(() => {}); } };
    document.addEventListener('visibilitychange', () => { if (!document.hidden) check(); });
    window.addEventListener('online', check);
  }).catch(() => {});
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (!reloaded) { reloaded = true; location.reload(); } });
}

/* ---------- boot ---------- */
function boot() {
  S.lang = lsGet(LSK.lang, null);
  S.size = lsGet(LSK.size, 0); if (!(S.size >= 0 && S.size < SIZES.length)) S.size = 0;
  S.model = lsGet(LSK.model, 'ecmwf'); if (!MODELS[S.model]) S.model = 'ecmwf';
  S.home = lsGet(LSK.home, null); if (!validHome(S.home)) S.home = null;
  S.strength = lsGet(LSK.strength, 1); if (!(S.strength >= 0 && S.strength <= 2)) S.strength = 1;
  const savedLy = lsGet(LSK.layers, {});   // only keys this version knows (an older build stored 'radar')
  for (const k of Object.keys(S.layers)) if (typeof savedLy[k] === 'boolean') S.layers[k] = savedLy[k];
  setDefaultHour();
  for (const old of ['ssw.cache.ecmwf', 'ssw.cache.gfs']) { try { localStorage.removeItem(old); } catch (e) {} }   // pre-v16 schema
  const cached = lsGet(cacheKey(S.model), null);
  if (cached) { try { useRaw(cached); } catch (e) { S.D = null; } }
  initMap();
  renderAll();
  if (!S.lang) { S.lang = null; showLangPicker(); }
  refresh(false);
  let lastHour = Math.floor(nowSec() / 3600);
  const tick = () => {
    if (document.hidden) return;
    renderFresh();
    if (S.D && !S.loading && Date.now() - S.D.at > AUTO_MIN * 60000) refresh(true);
    if (Date.now() - MAP.nea.loadedAt >= NEA_EVERY) syncNea(true);
    if (MAP.m) { syncSat(); syncHrp(); }                   // both limit themselves to one reload per 10 min
    const hr = Math.floor(nowSec() / 3600);
    if (hr !== lastHour) { lastHour = hr; renderAll(); }   // "now" cell, 10:00 switch to the next night, live wording
    else { renderLive(); if (S.A === null || (S.D && (Date.now() - S.D.at) / 3600000 > STALE_H)) renderAll(); }   // expiry of live and forecast shows even without new data
  };
  setInterval(tick, 60000);
  document.addEventListener('visibilitychange', tick);
  syncNea(); initSW(); spy();
}
boot();
</script>
